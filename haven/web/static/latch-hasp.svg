<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" class="latch-hasp-svg" role="img"
     aria-label="Latch hasp mark">
  <!-- Hinged gate-latch/hasp vector mark for the Latch plugin, shared by the
       native page (full) and the navigation rail (simplified). The full mark
       draws the whole hardware set: base plate with screws, hinge barrel and
       pin, hasp strap, U-shaped staple and T-handle. Simplified mode keeps
       only the strap + staple + handle silhouette. Every fill/stroke uses
       the shell's CSS tokens so the mark always follows the appearance
       control - no hardcoded palette. -->
  <style>
    .latch-hasp-svg { display: block; width: 100%; height: 100%; }
    .latch-hasp-svg .hasp-base { fill: var(--bg-raise-2); stroke: var(--border-strong); stroke-width: 1; }
    .latch-hasp-svg .hasp-screw { fill: var(--muted); stroke: none; }
    .latch-hasp-svg .hasp-hinge { fill: var(--teal); stroke: none; }
    .latch-hasp-svg .hasp-pin { fill: var(--bg-raise); stroke: none; }
    .latch-hasp-svg .hasp-strap { fill: var(--teal); stroke: none; }
    .latch-hasp-svg .hasp-staple { fill: none; stroke: var(--text); stroke-width: 2.4;
                                   stroke-linecap: round; stroke-linejoin: round; }
    .latch-hasp-svg .hasp-handle { fill: var(--text); stroke: none; }
    /* Simplified navigation mark: strap + staple + T-handle silhouette only. */
    .latch-hasp-svg.simplified .hasp-full-only { display: none; }
  </style>

  <!-- Base plate (post side) with its two screws. -->
  <g class="hasp-full-only">
    <rect class="hasp-base" x="6" y="8" width="9" height="32" rx="3" ry="3"/>
    <circle class="hasp-screw" cx="10.5" cy="13.3" r="1.3"/>
    <circle class="hasp-screw" cx="10.5" cy="34.7" r="1.3"/>
  </g>

  <!-- Hinge barrel where the strap pivots, with its pin. -->
  <g class="hasp-full-only">
    <circle class="hasp-hinge" cx="9" cy="16" r="5.5"/>
    <circle class="hasp-pin" cx="9" cy="16" r="1.6"/>
  </g>

  <!-- Hasp strap swinging from the hinge across the staple. -->
  <rect class="hasp-strap" x="9" y="12.75" width="30" height="6.5" rx="3.25" ry="3.25"/>

  <!-- Staple (U-shaped hasp receiver) closed over the strap slot. -->
  <path class="hasp-staple" d="M 28.5 10.5 L 37.5 10.5 L 37.5 21.5 L 28.5 21.5"/>

  <!-- T-handle thumb lever at the strap end. -->
  <rect class="hasp-handle" x="35.5" y="7.5" width="4" height="17" rx="2" ry="2"/>
  <rect class="hasp-handle" x="32.5" y="7" width="10" height="4.4" rx="2.2" ry="2.2"/>
</svg>
