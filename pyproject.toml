[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "haven-household"
version = "0.1.0"
description = "A local-first, authority-gated household intelligence layer"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
haven-desktop = "haven.desktop.shell:main"

[project.optional-dependencies]
dev = ["pytest>=8"]
# Only the plugin marketplace's catalog signature verification needs this.
# Without it, haven.plugins still imports and runs; catalog fetches fail
# closed with CatalogFetchError(code="verification_unavailable") instead
# of trusting an unverified catalog. See haven/plugins/catalog_client.py.
plugins = ["cryptography>=42"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["haven*"]
